# Build chrome-mv3 and publish it as the GitHub Release asset.
#
# Triggers:
# - Push of a version tag (vX.Y.Z)
# - Manual workflow_dispatch
name: Release Extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve extension version
        id: version
        run: |
          VERSION="$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("apps/extension/wxt.config.ts", "utf8");
            const match = text.match(/^\s*version:\s*["'\'']([\d.]+)["'\'']/m);
            if (!match) {
              console.error("Unable to read version from apps/extension/wxt.config.ts");
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved extension version: ${VERSION}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match wxt.config.ts version ${VERSION}"
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build chrome-mv3
        # Chrome only — root build:extension builds all browsers; release only needs chrome-mv3
        run: pnpm --filter hamhome build

      - name: Package chrome-mv3 artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="apps/extension/.output"
          test -d "${OUTPUT_DIR}/chrome-mv3"
          test -f "${OUTPUT_DIR}/chrome-mv3/manifest.json"

          # Zip chrome-mv3 contents (manifest at archive root)
          (
            cd "${OUTPUT_DIR}/chrome-mv3"
            zip -r -q "../hamhome-${VERSION}-chrome-mv3.zip" .
          )

          ls -lh "${OUTPUT_DIR}/hamhome-${VERSION}-chrome-mv3.zip"
          unzip -l "${OUTPUT_DIR}/hamhome-${VERSION}-chrome-mv3.zip" | head -20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: apps/extension/.output/hamhome-${{ steps.version.outputs.version }}-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail

          ASSET="apps/extension/.output/hamhome-${VERSION}-chrome-mv3.zip"
          test -f "${ASSET}"

          ARGS=(--title "${TAG}" --generate-notes)
          if [[ "${DRAFT}" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ARGS+=(--verify-tag)
          else
            ARGS+=(--target "${{ github.sha }}")
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading chrome-mv3 asset"
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" "${ARGS[@]}"
          fi

          echo "Published release ${TAG}"
          gh release view "${TAG}" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
