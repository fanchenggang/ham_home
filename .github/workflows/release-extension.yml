# Build extension with pnpm build:extension and publish GitHub Release artifacts.
#
# Triggers:
# - Push of a version tag (vX.Y.Z)
# - Manual workflow_dispatch
name: Release Extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve extension version
        id: version
        run: |
          VERSION="$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("apps/extension/wxt.config.ts", "utf8");
            const match = text.match(/^\s*version:\s*["'\'']([\d.]+)["'\'']/m);
            if (!match) {
              console.error("Unable to read version from apps/extension/wxt.config.ts");
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved extension version: ${VERSION}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match wxt.config.ts version ${VERSION}"
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension
        run: pnpm build:extension

      - name: Package build artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="apps/extension/.output"
          cd "${OUTPUT_DIR}"

          test -d chrome-mv3
          test -d firefox-mv2
          test -d edge-mv3

          # Zip contents (manifest at archive root) for store / sideload install
          (cd chrome-mv3 && zip -r -q "../hamhome-${VERSION}-chrome.zip" .)
          (cd firefox-mv2 && zip -r -q "../hamhome-${VERSION}-firefox.zip" .)
          (cd edge-mv3 && zip -r -q "../hamhome-${VERSION}-edge.zip" .)

          ls -lh "hamhome-${VERSION}"-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamhome-${{ steps.version.outputs.version }}
          path: |
            apps/extension/.output/hamhome-${{ steps.version.outputs.version }}-chrome.zip
            apps/extension/.output/hamhome-${{ steps.version.outputs.version }}-firefox.zip
            apps/extension/.output/hamhome-${{ steps.version.outputs.version }}-edge.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail

          ASSETS=(
            "apps/extension/.output/hamhome-${VERSION}-chrome.zip"
            "apps/extension/.output/hamhome-${VERSION}-firefox.zip"
            "apps/extension/.output/hamhome-${VERSION}-edge.zip"
          )

          ARGS=(--title "${TAG}" --generate-notes)
          if [[ "${DRAFT}" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ARGS+=(--verify-tag)
          else
            ARGS+=(--target "${{ github.sha }}")
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading assets"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" "${ARGS[@]}"
          fi

          echo "Published release ${TAG}"
          gh release view "${TAG}" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
